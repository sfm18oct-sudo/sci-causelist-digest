{% extends "base.html" %}
{% block content %}
<h1>Matches for {{ today }}</h1>
<p><a href="/">Back</a></p>
<table>
  <tr><th>Court</th><th>Item</th><th>Case</th><th>Parties</th><th>Advocates</th></tr>
  {% for item in items %}
  <tr>
    <td>{{ item.court_no }}</td>
    <td>{{ item.item_no }}</td>
    <td>{{ item.case_no }}</td>
    <td>{{ item.parties }}</td>
    <td>{{ item.advocates }}</td>
  </tr>
  {% else %}
  <tr><td colspan="5">No matches</td></tr>
  {% endfor %}
</table>
{% endblock %}
